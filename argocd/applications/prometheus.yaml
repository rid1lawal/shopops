apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kube-prometheus
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.8.2
      helm:
        valueFiles:
          - $values/deploy/helm/prometheus/values.yaml
        releaseName: kube-prometheus

    - repoURL: https://github.com/rid1lawal/shopops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: shopops-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
