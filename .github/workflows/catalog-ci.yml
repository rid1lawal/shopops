name: Catalog CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/catalog-ci.yml"

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: shopopsacr.azurecr.io
  IMAGE_NAME: catalog-service

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name shopopsacr
