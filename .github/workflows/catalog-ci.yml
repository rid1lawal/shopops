name: Catalog CI

on:
  push:
    branches:
      - main
    paths:
      - "services/catalog/**"
      - ".github/workflows/catalog-ci.yml"

permissions:
  contents: write
  id-token: write

env:
  REGISTRY: shopopsacr.azurecr.io
  IMAGE_NAME: catalog-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test-and-build:
    name: Test, Build and Push
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/catalog

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/catalog/go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name shopopsacr

      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:$IMAGE_TAG \
            -t $REGISTRY/$IMAGE_NAME:main \
            .

      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          docker push $REGISTRY/$IMAGE_NAME:main

      - name: Install yq
        run: |
          YQ_VERSION="v4.53.3"
              
          sudo wget \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -O /usr/local/bin/yq
              
          sudo chmod +x /usr/local/bin/yq
              
          yq --version

      - name: Update dev image tag
        working-directory: .
        run: |
          yq -i '.image.tag = strenv(IMAGE_TAG)' \
            deploy/environments/dev/catalog/values.yaml

      - name: Commit updated image tag
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deploy/environments/dev/catalog/values.yaml

          if git diff --cached --quiet; then
            echo "No image tag change to commit."
            exit 0
          fi

          git commit -m "chore(catalog): update dev image to ${IMAGE_TAG}"
          git push
