name: Order CI

on:
  push:
    branches:
      - main
    paths:
      - "services/order/**"
      - ".github/workflows/order-ci.yml"

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: shopops
  IMAGE_TAG: ${{ github.sha }}

concurrency:
  group: order-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test, Build and Push
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/order

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/order/go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Order image
        uses: docker/build-push-action@v6
        with:
          context: services/order
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:order-${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag in values.yaml
        working-directory: .
        run: |
          yq -i '.image.tag = "order-${{ env.IMAGE_TAG }}"' deploy/environments/dev/order/values.yaml

      - name: Commit and push updated values
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/environments/dev/order/values.yaml
          git diff --staged --quiet || git commit -m "chore(order): bump image tag to order-${{ env.IMAGE_TAG }}"
          git push