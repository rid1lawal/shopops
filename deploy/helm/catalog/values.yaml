# replicaCount is the number of catalog pods to run.
replicaCount: 1

image:
  # image.repository is the container image repository.
  repository: shopopsacr.azurecr.io/catalog-service

  # image.tag is the immutable image tag to deploy.
  tag: ""

  # image.pullPolicy controls when Kubernetes pulls the image.
  pullPolicy: IfNotPresent

service:
  # service.type is the Kubernetes Service type.
  type: ClusterIP

  # service.port is the port exposed by the Service.
  port: 8080

  # service.targetPort is the port exposed by the container.
  targetPort: 8080

config:
  httpPort: "8080"
  environment: ""
  otlpEndpoint: "otel-collector.shopops-dev.svc.cluster.local:4317"
  serviceName: "catalog"

azure:
  workloadIdentity:
    clientId: ""

  keyVault:
    name: ""
    tenantId: ""

database:
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

deployment:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  terminationGracePeriodSeconds: 30

  startupProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30

  livenessProbe:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3


resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi

serviceMonitor:
  enabled: true
  interval: 15s
  path: /metrics