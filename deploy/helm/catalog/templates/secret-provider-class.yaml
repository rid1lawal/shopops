apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "catalog.fullname" . }}-secrets
  labels:
    {{- include "catalog.labels" . | nindent 4 }}

spec:
  provider: azure

  secretObjects:
    - secretName: catalog-db
      type: Opaque
      data:
        - objectName: DATABASE-URL
          key: DATABASE_URL

  parameters:
    usePodIdentity: "false"
    clientID: {{ required "azure.workloadIdentity.clientId must be set" .Values.azure.workloadIdentity.clientId | quote }}
    keyvaultName: {{ required "azure.keyVault.name must be set" .Values.azure.keyVault.name | quote }}
    tenantId: {{ required "azure.keyVault.tenantId must be set" .Values.azure.keyVault.tenantId | quote }}

    objects: |
      array:
        - |
          objectName: DATABASE-URL
          objectType: secret