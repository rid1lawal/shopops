mode: deployment

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
  tag: "0.156.0"

command:
  name: otelcol-k8s

config:
  exporters:
    debug: {}
    otlp/tempo:
      endpoint: tempo.shopops-dev.svc.cluster.local:4317
      tls:
        insecure: true
    
    otlphttp/loki:
      endpoint: http://loki.shopops-dev.svc.cluster.local:3100/otlp
      tls:
        insecure: true

    prometheus:
      endpoint: 0.0.0.0:8889

  service:
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - debug
          - otlp/tempo

      metrics:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - debug
          - prometheus

      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - debug
          - otlphttp/loki

ports:
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 250m
    memory: 256Mi