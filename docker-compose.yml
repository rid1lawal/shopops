# DISCLAIMER: This docker-compose file is for local development and testing purposes only. It is not intended for production use.
# Environment secrets should never be made public

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: shopops
      POSTGRES_PASSWORD: shopops
      POSTGRES_DB: catalog_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopops -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  catalog:
    build:
      context: ./services/catalog
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://shopops:shopops@postgres:5432/catalog_db
      HTTP_PORT: "8080"
      SERVICE_NAME: catalog
      ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  order:
    build:
      context: ./services/order
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://shopops:shopops@postgres:5432/order_db
      HTTP_PORT: "8081"
      CATALOG_SERVICE_URL: http://catalog:8080
      ENVIRONMENT: development
      SERVICE_NAME: order
      OTLP_ENDPOINT: jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_healthy
      jaeger:
        condition: service_started

volumes:
  postgres_data: